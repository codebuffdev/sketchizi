name: Workspace Feature CI

on:
  push:
    branches:
      - main
      - feature/cloud-workspace-phase1-ui
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Workspace gateway and auth gateway
        run: |
          npm run test:workspace-gateway
          npm run test:auth
      - name: Build production frontend
        run: npm run build
