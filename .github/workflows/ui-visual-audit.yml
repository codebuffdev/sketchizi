name: Sketchizi UI Visual Audit

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: Deployed staging or preview URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sketchizi-ui-visual-audit
  cancel-in-progress: false

jobs:
  visual-audit:
    name: Responsive UI visual audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser audit tooling
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run responsive visual audit
        env:
          SKETCHIZI_BASE_URL: ${{ inputs.staging_url }}
          UI_VISUAL_OUTPUT_DIR: artifacts/ui-visual-audit
        run: node scripts/ui-visual-audit.mjs
      - name: Verify visual audit contract
        if: always()
        run: node --test tests/ui-modernization-visual-audit.test.js
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sketchizi-ui-visual-audit
          path: artifacts/ui-visual-audit/
          if-no-files-found: ignore
          retention-days: 14
