name: Sketchizi Production Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sketchizi-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify package-lock consistency
        run: npm run check:package-lock-consistency

      - name: Verify build prerequisites
        run: npm run check:build-prerequisites

      - name: Run automated regression suite
        run: npm run test:all

      - name: Build production application
        run: npm run build

      - name: Install temporary browser-test tooling
        run: npm install --no-save --no-package-lock playwright

      - name: Install Chromium for browser smoke test
        run: npx playwright install --with-deps chromium

      - name: Start production preview
        run: npm run preview -- --host 127.0.0.1 > /tmp/sketchizi-preview.log 2>&1 &

      - name: Run template creation browser smoke test
        run: node scripts/browser-smoke.mjs

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: sketchizi-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
