name: Sketchizi Production Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sketchizi-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify package-lock consistency
        run: npm run check:package-lock-consistency

      - name: Verify build prerequisites
        run: npm run check:build-prerequisites

      - name: Run automated regression suite
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:all > /tmp/sketchizi-current-tests.tap 2>&1
          status=$?
          tail -n 45 /tmp/sketchizi-current-tests.tap
          exit "$status"

      - name: Compare regression failures with main
        id: regression-baseline
        if: ${{ always() && steps.regression.outcome == 'failure' }}
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          git worktree add --detach /tmp/sketchizi-main FETCH_HEAD
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/sketchizi-main/node_modules
          (cd /tmp/sketchizi-main && npm run test:all) > /tmp/sketchizi-main-tests.tap 2>&1 || true
          node scripts/compare-test-baseline.mjs /tmp/sketchizi-main-tests.tap /tmp/sketchizi-current-tests.tap

      - name: Build production application
        run: npm run build

      - name: Report production JS and CSS size
        run: npm run report:build-assets

      - name: Install temporary browser-test tooling
        run: |
          npm install --prefix /tmp/sketchizi-browser-tools --no-save --no-package-lock playwright
          ln -s /tmp/sketchizi-browser-tools/node_modules/playwright node_modules/playwright

      - name: Install Chromium for browser smoke test
        run: /tmp/sketchizi-browser-tools/node_modules/.bin/playwright install --with-deps chromium

      - name: Start production preview
        run: npm run preview -- --host 127.0.0.1 > /tmp/sketchizi-preview.log 2>&1 &

      - name: Wait for production preview readiness
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Production preview is responding."
              exit 0
            fi
            sleep 2
          done
          echo "Production preview did not become ready in 60 seconds."
          cat /tmp/sketchizi-preview.log || true
          exit 1

      - name: Run template creation browser smoke test
        run: node scripts/browser-smoke.mjs

      - name: Build the base editor for persistence compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach /tmp/sketchizi-base-editor "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/sketchizi-base-editor/node_modules
          cd /tmp/sketchizi-base-editor
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4174 --strictPort >/tmp/sketchizi-base-preview.log 2>&1 &

      - name: Verify a base-build drawing opens on the candidate
        if: github.event_name == 'pull_request'
        env:
          SKETCHIZI_PREVIOUS_BUILD_URL: http://127.0.0.1:4174
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent "$SKETCHIZI_PREVIOUS_BUILD_URL/" >/dev/null; then
              node scripts/browser-drawing-smoke.mjs
              exit
            fi
            sleep 1
          done
          cat /tmp/sketchizi-base-preview.log
          exit 1

      - name: Verify drawing interactions and local persistence
        run: node scripts/browser-drawing-smoke.mjs

      - name: Verify mobile drawing canvas at phone widths
        run: node scripts/browser-mobile-editor-smoke.mjs

      - name: Verify signed-in account dropdown layout
        run: node scripts/browser-account-menu-smoke.mjs

      - name: Write CI verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Sketchizi production verification"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Node: \`$(node --version)\`"
            echo "- npm: \`$(npm --version)\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- The job status is authoritative; a summary alone does not imply success."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sketchizi-production-verification-logs
          path: /tmp/sketchizi-preview.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: sketchizi-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      # Existing failures on main are tracked as baseline debt. New failures
      # still fail this PR; baseline-only failures do not block unrelated work.
      - name: Enforce regression suite result
        if: ${{ always() && steps.regression.outcome == 'failure' && steps.regression-baseline.outcome != 'success' }}
        run: |
          echo "::error::Automated regression suite failed; see the test step above."
          exit 1
