name: Page canvas verification
on:
  push:
    paths:
      - 'src/features/pages/**'
      - 'src/components/app/DesktopAppHeader.jsx'
      - 'scripts/browser-page-canvas-smoke.mjs'
      - '.github/workflows/page-canvas.yml'
  pull_request:
    paths:
      - 'src/features/pages/**'
      - 'src/components/app/DesktopAppHeader.jsx'
      - 'scripts/browser-page-canvas-smoke.mjs'
      - '.github/workflows/page-canvas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/page-canvas.test.js
      - run: npm run build
      - name: Install temporary browser-test tooling
        run: |
          npm install --prefix /tmp/sketchizi-browser-tools --no-save --no-package-lock playwright
          ln -s /tmp/sketchizi-browser-tools/node_modules/playwright node_modules/playwright
      - name: Install Chromium for browser smoke test
        run: /tmp/sketchizi-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Start preview and verify pages
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/sketchizi-pages-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-page-canvas-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-canvas-screenshots
          path: |
            /tmp/sketchizi-page-*.png
            /tmp/sketchizi-pages-preview.log
