services:
    - type: web
      name: sketchizi-auth
      runtime: docker
      rootDir: auth-service
      dockerfilePath: Dockerfile
      dockerContext: .
      healthCheckPath: /actuator/health
      envVars:
          - key: SPRING_PROFILES_ACTIVE
            value: prod
          - key: COOKIE_SECURE
            value: "true"
          - key: PUBLIC_BASE_URL
            value: https://sketchizi.pages.dev
          - key: FRONTEND_ORIGIN
            value: https://sketchizi.pages.dev
          - key: DB_POOL_SIZE
            value: "5"
          - key: DATABASE_URL
            sync: false
          - key: DATABASE_USERNAME
            sync: false
          - key: DATABASE_PASSWORD
            sync: false
          - key: GOOGLE_CLIENT_ID
            sync: false
          - key: GOOGLE_CLIENT_SECRET
            sync: false
