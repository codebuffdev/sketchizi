server:
  port: ${PORT:8090}
  address: 0.0.0.0
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: sketchizi-ai-service
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 0
      connection-timeout: 15000
      validation-timeout: 5000
      idle-timeout: 240000
      max-lifetime: 1500000
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${GEMINI_MODEL:gemini-2.5-flash}
          temperature: 0.2
          max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:2048}
    retry:
      max-attempts: 1
  jackson:
    deserialization:
      fail-on-unknown-properties: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  identity:
    audience: sketchizi-ai
    hmac-secret: ${AI_IDENTITY_HMAC_SECRET:}
  limits:
    max-request-body-bytes: ${AI_MAX_REQUEST_BODY_BYTES:921600}
    max-elements: ${AI_MAX_DIAGRAM_ELEMENTS:1500}
    max-diagram-context-chars: ${AI_MAX_DIAGRAM_CONTEXT_CHARS:180000}
    max-question-chars: ${AI_MAX_QUESTION_CHARS:4000}
    max-history-messages: ${AI_MAX_HISTORY_MESSAGES:12}
    max-history-chars: ${AI_MAX_HISTORY_CHARS:48000}
    max-requests-per-minute: ${AI_MAX_REQUESTS_PER_MINUTE:60}
    max-submissions-per-minute: ${AI_MAX_SUBMISSIONS_PER_MINUTE:10}
    max-concurrent-requests: ${AI_MAX_CONCURRENT_REQUESTS:2}
    reservation-lease-seconds: ${AI_RESERVATION_LEASE_SECONDS:120}
    conversation-question-limit: ${AI_CONVERSATION_QUESTION_LIMIT:5}
    account-question-limit: ${AI_ACCOUNT_QUESTION_LIMIT:10}
    account-window-hours: ${AI_ACCOUNT_WINDOW_HOURS:12}
    provider-timeout-seconds: ${AI_PROVIDER_TIMEOUT_SECONDS:45}
    max-answer-chars: ${AI_MAX_ANSWER_CHARS:16000}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.springframework.ai: WARN
