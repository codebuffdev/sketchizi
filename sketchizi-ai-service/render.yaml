services:
  - type: web
    name: sketchizi-ai-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8090
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: 2048
      - key: AI_IDENTITY_HMAC_SECRET
        sync: false
      - key: AI_MAX_REQUEST_BODY_BYTES
        value: 921600
      - key: AI_CONVERSATION_QUESTION_LIMIT
        value: 5
      - key: AI_ACCOUNT_QUESTION_LIMIT
        value: 10
      - key: AI_ACCOUNT_WINDOW_HOURS
        value: 12
      - key: AI_MAX_CONCURRENT_REQUESTS
        value: 2
